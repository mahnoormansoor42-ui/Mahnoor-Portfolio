<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Bright Sprout Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #FFF4E6 0%, #FAF6EE 50%, #E8F5E9 100%);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid #ECE7DE;
      text-align: center;
    }
    .login-brand-icon {
      width: 64px;
      height: 64px;
      background: #E8F8EE;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 20px;
      border: 1px solid #C4EED1;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.12);
    }
    .login-title {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #2D3748;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 28px;
    }
    .login-form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4A5568;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #E2E8F0;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
      background: #FDFBF7;
    }
    .form-input:focus {
      outline: none;
      border-color: #2E7D32;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    }
    .btn-login {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      background: #2E7D32;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(46, 125, 50, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover {
      background: #256628;
      transform: translateY(-1px);
    }
    .alert-error {
      background: #FFF5F5;
      color: #C53030;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      border: 1px solid #FEB2B2;
      margin-bottom: 16px;
      display: none;
    }
    .login-helper {
      margin-top: 24px;
      padding: 12px;
      background: #F7FAFC;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #718096;
      border: 1px dashed #CBD5E0;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.88rem;
      color: #4A5568;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover {
      color: #2E7D32;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand-icon">🌱</div>
    <h1 class="login-title">Studio Admin Portal</h1>
    <p class="login-sub">Sign in to manage your workbooks, leads, and store content</p>

    <div id="loginAlert" class="alert-error"></div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-input" placeholder="admin" value="admin" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" value="password123" required>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">
        <span>Sign In to Dashboard →</span>
      </button>
    </form>

    <div class="login-helper">
      💡 <strong>Default Local Credentials:</strong><br>
      User: <code>admin</code> &bull; Password: <code>password123</code>
    </div>

    <a href="../index.html" class="back-link">← Return to Public Storefront</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const loginBtn = document.getElementById('loginBtn');

    // If already logged in, redirect to dashboard
    const existingToken = localStorage.getItem('bss_admin_token');
    if (existingToken) {
      fetch('/api/auth/verify', {
        headers: { 'Authorization': 'Bearer ' + existingToken }
      })
      .then(res => res.json())
      .then(data => {
        if (data.valid) {
          window.location.href = 'index.html';
        }
      })
      .catch(() => {});
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>Signing in... ⏳</span>';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('bss_admin_token', data.token);
          localStorage.setItem('bss_admin_user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          alertBox.textContent = data.error || 'Invalid username or password.';
          alertBox.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Sign In to Dashboard →</span>';
        }
      } catch (err) {
        alertBox.textContent = 'Server connection error. Please make sure the server is running.';
        alertBox.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Sign In to Dashboard →</span>';
      }
    });
  </script>
</body>
</html>
